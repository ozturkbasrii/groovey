name: Groovey
options:
  bundleIdPrefix: io.github.ozturkbasrii
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
targets:
  # Loaded by /usr/bin/perl at runtime, never linked into the app.
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/MediaRemoteAdapter
        excludes:
          - LICENSE
          - UPSTREAM_COMMIT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ozturkbasrii.groovey.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/MediaRemoteAdapter
          - $(SRCROOT)/Vendor/MediaRemoteAdapter/include
  Groovey:
    type: application
    platform: macOS
    sources:
      - path: Groovey
    dependencies:
      - target: MediaRemoteAdapter
        embed: true
        link: false
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ozturkbasrii.groovey
        PRODUCT_NAME: Groovey
        INFOPLIST_FILE: Groovey/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Groovey/Resources/Groovey.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
  GrooveyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GrooveyTests
    dependencies:
      - target: Groovey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ozturkbasrii.groovey.tests
schemes:
  Groovey:
    build:
      targets:
        Groovey: all
        GrooveyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GrooveyTests
    archive:
      config: Release
